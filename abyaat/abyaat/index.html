<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أبيات</title>
  <meta name="description" content="أبيات: حفظ القصائد والمتون العربية بالمراجعة المتباعدة">
  <meta name="theme-color" content="#eadfc6">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="أبيات">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" href="fonts/amiri-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    /* يطبّق المظهر واللغة قبل الرسم حتى لا يومض الشاشة */
    try {
      var st = (JSON.parse(localStorage.getItem('abyaat:v1')) || {}).settings || {}, r = document.documentElement;
      var dk = st.theme === 'dark' || (st.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      r.dataset.theme = dk ? 'dark' : 'light';
      if (st.lang === 'en') { r.lang = 'en'; r.dir = 'ltr'; }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="top">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span>أبيات</h1>
    <button id="mode-back" class="back" type="button" data-act="mode-back" hidden><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><span data-i18n="navHome">الحفظ والمراجعة</span></button>
    <button id="poem-chip" class="chip" type="button" data-tab="lib" hidden></button>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>

  <nav id="tabs" aria-label="التنقل الرئيسي" data-i18n-aria="navLabel">
    <button type="button" data-tab="home" aria-label="الحفظ والمراجعة" data-i18n-aria="navHome">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="navHome">الحفظ والمراجعة</span><i class="badge" hidden></i>
    </button>
    <button type="button" data-tab="lib" aria-label="المكتب" data-i18n-aria="navLib">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>
      <span data-i18n="navLib">المكتب</span>
    </button>
    <button type="button" data-tab="settings" aria-label="الإعدادات" data-i18n-aria="navSettings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span data-i18n="navSettings">الإعدادات</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">يحتاج «أبيات» إلى تفعيل JavaScript. / Abyaat needs JavaScript.</p></noscript>

  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/fsrs.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
